[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fairfare"
version = "0.1.0"
description = "Cost-transparent, verified, family-aware trip planning. Starts with a travel-quote auditor."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.5",
  "langgraph>=0.2",
  "litellm>=1.40",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "trafilatura>=1.12",
  "ddgs>=9.0",
  "fastapi>=0.110",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
browser = ["playwright>=1.44"]  # JS-rendered operator sites and PDF export

[project.scripts]
fairfare = "fairfare.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
